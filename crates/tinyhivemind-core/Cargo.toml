[package]
name = "tinyhivemind-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-neutral agent coordination: grammar, session ports, routing, hive folds, and completion driver."
documentation = "https://docs.rs/tinyhivemind-core"
readme = "../../README.md"
keywords = ["agents", "chat", "mentions", "roster", "transcript"]
categories = ["development-tools"]
publish = false

# Core owns all host-neutral logic and ports. It opens no storage or transport
# and must not link OpenHuman or TinyTools. assert-pure.sh guards this boundary.
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
tinyjevclient = { workspace = true }

[features]
default = []
# Compiles opt-in tests that can call external model providers. Live execution
# still requires the explicit environment switch documented in docs/testing.md.
e2e = []

[lints]
workspace = true

[[example]]
name = "bench"
path = "examples/bench/main.rs"
test = true

[[example]]
name = "driver_bench"
path = "examples/driver_bench/main.rs"
