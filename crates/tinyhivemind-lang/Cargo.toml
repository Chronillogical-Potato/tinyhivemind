[package]
name = "tinyhivemind-lang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Runtime-neutral values produced by lowering.
tinyhivemind-core.workspace = true
# Stable manifest and patch wire format.
serde.workspace = true
# Parse caller-supplied canonical JSON documents.
serde_json.workspace = true
# Typed package errors.
thiserror.workspace = true
# Cryptographic version identities, without I/O.
sha2.workspace = true

[lints]
workspace = true

# Discovered automatically like the other examples; declared only so that
# `cargo test` runs its offline tests (the gallery runs, the pinned frame wire
# form, the 50-seat turn-budget check) rather than just building it.
[[example]]
name = "hive_view"
path = "examples/hive_view/main.rs"
test = true

# Discovered automatically like the other examples; declared so that
# `cargo test` runs its offline tests of the command-line check.
[[example]]
name = "hive_check"
path = "examples/hive_check/main.rs"
test = true
