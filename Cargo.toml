[workspace]
resolver = "3"
# Every crate in this repository lives under `crates/`, one directory per
# package, each directory named for the package it holds. There is no root
# package: the crate a host links is `crates/tinyhivemind-core`, the same as any
# other member. Keeping the root virtual is what makes that uniform.
members = ["crates/*"]
# `worktrees/` holds `git worktree` checkouts of this same repository; each
# contains a full copy of this manifest and every crate under it, so without
# this entry cargo walks into them and reports duplicate packages.
exclude = ["vendor", "worktrees"]

# Shared package metadata. A member inherits a field with `field.workspace =
# true`, so the version is written in exactly one place and every crate moves
# together. There is no release workflow and nothing here is published: a
# consumer pins a git commit, and that commit is the version.
[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinyhivemind"

[workspace.dependencies]
# The pure half: the desk/roster/mention/session algebra. `crates/tinyhivemind`
# (the session runtime, added in P4) depends on it and re-exports it, so a host
# that only needs the algebra takes this crate alone.
# No `version` requirement on purpose: the workspace version can move on any
# commit, and a pinned requirement here would stop resolving the moment it did.
# Nothing in this workspace is published, so the path is the whole address.
tinyhivemind-core = { path = "crates/tinyhivemind-core" }
# The session runtime: the host ports, attributed projection, and continuous
# sharing. `crates/tinyhivemind-hive` folds over its session types and depends on
# it directly; a host that wants group deliberation takes the hive crate and
# gets both of the others transitively.
tinyhivemind = { path = "crates/tinyhivemind" }
# Bounded group deliberation over a shared desk: traces, salience, quorum with
# cross-inhibition, and the attention market. Pure, and opt-in — a host that
# only wants one-responder routing never links it.
tinyhivemind-hive = { path = "crates/tinyhivemind-hive" }
# Host-facing conversation surfaces and Jev-first routing composition. This
# remains transport-neutral so OpenCompany can embed it without host types.
tinyhivemind-embed = { path = "crates/tinyhivemind-embed" }
# Exact System One wire types and Jev question construction behind one host
# transport port; it deliberately contains no HTTP client or async runtime.
tinyhivemind-typesafe = { path = "crates/tinyhivemind-typesafe" }
# The room's tools served over MCP, for a harness that cannot be handed a native
# tool. The one socket the repository opens -- see ADR 0022 -- and therefore a
# separate, explicit dependency that no pure or runtime crate may take.
# The episode's tools as a record a host drains, and their definitions. Opens
# nothing; `tinyhivemind-mcp` is the wire over it.
tinyhivemind-tools = { path = "crates/tinyhivemind-tools" }
# The completion driver over a handle the host binds. Names no harness and
# sits in the pure list; `tinyhivemind-openhuman` is its OpenHuman adapter.
tinyhivemind-driver = { path = "crates/tinyhivemind-driver" }
tinyhivemind-mcp = { path = "crates/tinyhivemind-mcp" }
# The harness, for `tinyhivemind-openhuman` and nothing else under `crates/*`.
# `openhuman-embed` is the `AgentSpec` seat; `openhuman` (the core) is the raw
# session one level down; `tinytools` and `tinytools-agent` are the `Tool` a
# raw session's belt is made of and the dialect it speaks. Default features
# off: the adapter names the one feature it needs, and the consuming host
# chooses the rest.
#
# Git dependencies on purpose, not the vendored path. A host that vendors this
# repository as a submodule (OpenCompany) carries its own `vendor/openhuman`
# and must link ONE copy of OpenHuman: the `Agent` in a binding here has to
# be the same type the host built, the `Tool` a raw session takes has to be
# the `Tool` this repository implements, and OpenHuman's process-wide state
# must exist once. Cargo `[patch]` can redirect a git or registry source onto
# a path but cannot redirect a path source, so a path here would leave a host
# no way to unify the two trees. The `[patch]` tables below point these same
# sources at the vendored checkout for this repository's own build, and a
# host writes the same four lines against its own. `tinytools` is pinned at
# the commit OpenHuman's own tree vendors, which is what makes the unification
# exact; `.github/scripts/assert-openhuman-pin.sh` checks all three revs.
openhuman-embed = { git = "https://github.com/tinyhumansai/openhuman", rev = "a301d99829e6a35318860b17d809239f883889cd", default-features = false }
openhuman = { git = "https://github.com/tinyhumansai/openhuman", rev = "a301d99829e6a35318860b17d809239f883889cd", default-features = false }
tinytools = { git = "https://github.com/tinyhumansai/tinytools", rev = "b47ccd1a58ec1bb0de51f8a732261bda701bbab6" }
tinytools-agent = { git = "https://github.com/tinyhumansai/tinytools", rev = "b47ccd1a58ec1bb0de51f8a732261bda701bbab6" }
# Derive macros for the crate-wide error type in `crates/tinyhivemind-core/src/error/`.
# Every dependency entry should carry a comment like this one saying why it is
# here.
thiserror = "2"
# Desk overlays, mentions and session messages cross a wire: they are stored
# inside the host's own records and its append-only journal. Their serde
# attributes are part of that wire format and travel with the type definitions.
serde = { version = "1", features = ["derive"] }
# Pins the exact JSON object shape and required fields of host-facing DTOs in
# unit tests without adding JSON handling to the runtime dependency graph.
serde_json = "1"
# Optional, and off by default. Powers the `regex` feature of the `select`
# module: a search that cannot be spelled as a substring is spelled as an
# expression instead. Default features are off because a picker needs matching
# and case folding, not the whole crate's optional syntax surface.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
# Drives only the runtime crate's async unit tests. The library itself remains
# executor-neutral and exposes boxed futures at its host port.
tokio = { version = "1", features = ["macros", "rt", "sync"] }
# EXAMPLE-ONLY, and it must stay that way. The provider layer the `desk`
# example reaches a model through: a `ChatModel` with streaming, OpenAI-shaped
# adapters, and normalized provider failures, in place of the `curl`
# subprocess and hand-written request body it used before. It pulls `reqwest`,
# `tokio` and `futures`, so no library crate may take it — see
# docs/adr/0013-a-vendored-crate-is-an-example-dependency.md. A consumer builds
# `crates/*` and never the examples, so it never resolves this.
tinyinference-llm = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-llm" }
# `tinytools::Tool`, OpenHuman's `ToolPolicy` and its `Memory` are async
# traits. The `desk` example and the OpenHuman adapter implement them; no
# other crate may take this.
async-trait = "0.1"
# `tinytools::Tool::execute` returns `anyhow::Result`, so implementing it
# means naming the type, and every OpenHuman entry point returns it too. It
# is forbidden in every crate `assert-pure.sh` guards and reaches only the
# `desk` example (a dev-dependency edge) and `tinyhivemind-openhuman`, the
# one crate that links the harness.
anyhow = "1"
# The adapter's scripted model and backend stub, behind its `offline`
# feature, and its own tests.
wiremock = "0.6"
# A workspace to seat raw sessions in, for the adapter's tests.
tempfile = "3"
# EXAMPLE-ONLY. The benchmark's Jev arm uses the native System One client;
# library crates keep only provider-neutral fixed-point decision snapshots.
tinyjevclient = { path = "vendor/tinyjevclient/crates/tinyjevclient", default-features = false }


# Lints apply to every member that opts in with `[lints] workspace = true`, and
# to every target of that member. CI runs clippy with `-D warnings`, so anything
# set to "warn" here fails the build in CI.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Resolve the git `openhuman-embed` above onto the vendored submodule so this
# workspace builds against exactly the tree it records (and CI, which checks
# out submodules recursively, needs no network for it). The `rev` above and
# the submodule pointer must agree; `.github/scripts/assert-openhuman-pin.sh`
# fails the build when they drift.
[patch."https://github.com/tinyhumansai/openhuman"]
openhuman-embed = { path = "vendor/openhuman/crates/openhuman-embed" }
openhuman = { path = "vendor/openhuman/crates/openhuman-core" }

# The same, for the tool crates: onto the copy inside the vendored OpenHuman,
# the one OpenHuman itself resolves them from, so a raw session's `Tool` is
# this repository's `Tool`.
[patch."https://github.com/tinyhumansai/tinytools"]
tinytools = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinytools/crates/tinytools" }
tinytools-agent = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinytools/crates/tinytools-agent" }
