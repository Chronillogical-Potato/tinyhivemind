<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Hive Lab Run Viewer</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1c1d21; --muted: #5d6068;
  --line: #d9dadf; --accent: #1f5fbf; --bad: #c4261d; --good: #1a7f45;
  --blind: #e4e6ec; --full: #cfe0f7; --tick: #1c1d21;
  --s0: #0072b2; --s1: #d55e00; --s2: #009e73; --s3: #cc79a7;
  --s4: #8a6d00; --s5: #56b4e9; --s6: #7a4fd0; --s7: #5b5f66;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14151a; --panel: #1d1f26; --ink: #ececf0; --muted: #a0a4ae;
    --line: #353844; --accent: #7fb0ff; --bad: #ff7b72; --good: #5fd08a;
    --blind: #2a2d38; --full: #25395c; --tick: #ececf0;
    --s0: #56b4e9; --s1: #ff9d4d; --s2: #3fd1a0; --s3: #e9a0c8;
    --s4: #e6c34a; --s5: #8fd0ff; --s6: #b69cff; --s7: #b4b8c2;
  }
}
:root[data-theme="dark"] {
  --bg: #14151a; --panel: #1d1f26; --ink: #ececf0; --muted: #a0a4ae;
  --line: #353844; --accent: #7fb0ff; --bad: #ff7b72; --good: #5fd08a;
  --blind: #2a2d38; --full: #25395c; --tick: #ececf0;
  --s0: #56b4e9; --s1: #ff9d4d; --s2: #3fd1a0; --s3: #e9a0c8;
  --s4: #e6c34a; --s5: #8fd0ff; --s6: #b69cff; --s7: #b4b8c2;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 0 0 8px; }
h3 { font-size: 14px; margin: 16px 0 6px; }
p { margin: 4px 0; }
.muted { color: var(--muted); }
a, button, select, summary, input { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 12px; margin: 12px 0; }
.drop { border: 2px dashed var(--line); text-align: center; padding: 18px 12px; }
.drop.over { border-color: var(--accent); background: var(--full); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.bar.centered { justify-content: center; }
button, select, label.btn { font: inherit; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; cursor: pointer; min-height: 32px; }
button:hover, label.btn:hover { border-color: var(--accent); }
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
label.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
#status { min-height: 1.4em; }
#status.err { color: var(--bad); }
.scroll { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td.l, th.l { text-align: left; }
.up { color: var(--bad); } .down { color: var(--good); }
svg { display: block; }
svg text { fill: var(--ink); font-size: 11px; }
svg .axis text, svg .dim { fill: var(--muted); }
svg .axis line, svg .grid { stroke: var(--line); }
.hit { cursor: default; }
.hit:focus-visible { outline: 2px solid var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0; font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.share { display: grid; grid-template-columns: minmax(70px, 110px) 1fr; gap: 4px 8px; align-items: center; }
.share .track { display: flex; height: 16px; }
.share .track div { height: 100%; }
.share .nums { grid-column: 2; font-size: 12px; color: var(--muted); margin-top: -2px; }
details summary { cursor: pointer; padding: 4px 0; }
#tip { position: fixed; z-index: 10; max-width: min(420px, calc(100vw - 16px)); pointer-events: none;
  background: var(--ink); color: var(--bg); border-radius: 6px; padding: 6px 8px; font-size: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.35); display: none; }
#tip b { display: block; margin-bottom: 2px; }
#tip pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 11px/1.35 ui-monospace, Menlo, Consolas, monospace; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 480px) { main { padding: 12px 16px; } .card { padding: 10px; } }
</style>
</head>
<body>
<main>
  <h1>Hive Lab Run Viewer</h1>
  <p class="muted">Inspect telemetry from one or more runs: per-seat waterfall, room timeline, token cost, and a side-by-side summary. Everything stays in your browser.</p>

  <section class="card" id="runs-panel" aria-label="Runs on disk"></section>

  <section class="card drop" id="drop" aria-label="Load runs from files">
    <p><strong>Or drop one or more <code>.jsonl</code> run files here</strong></p>
    <div class="bar centered">
      <label class="btn">Choose files<input type="file" id="picker" accept=".jsonl,.json,.ndjson,.txt,application/json" multiple></label>
            <button type="button" id="clear">Clear</button>
    </div>
    <p id="status" class="muted" role="status" aria-live="polite">No runs loaded. URL form: <code>?file=a.jsonl&amp;file=b.jsonl</code></p>
  </section>

  <div id="out" hidden>
    <section class="card" aria-labelledby="h-sum">
      <h2 id="h-sum">Summary</h2>
      <div class="bar" id="pick" hidden>
        <label>Run A <select id="selA"></select></label>
        <label>Run B <select id="selB"></select></label>
        <span class="muted">Delta is B minus A.</span>
      </div>
      <div class="scroll" tabindex="0" role="region" aria-label="Run summary table" id="summary"></div>
    </section>
    <div id="runs"></div>
  </div>
</main>
<div id="tip" role="tooltip"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
