[package]
name = "tinyhivemind-openhuman-example"
version = "0.0.0"
edition = "2024"
publish = false

# This is deliberately a standalone crate rather than a workspace member.
# Its live binaries and independent lockfile keep experiment-only dependencies
# out of normal workspace builds while exercising the OpenHuman library adapter.
[workspace]

[dependencies]
anyhow = "1"
futures = "0.3"
# The live hive uses OpenHuman's native runtime, agents, sessions, and TinyCortex module.
openhuman-embed = { path = "../../vendor/openhuman/crates/openhuman-embed", default-features = false, features = ["mcp", "modules"] }
# The DeepSWE adapter registers its per-seat definitions with OpenHuman's
# runtime registry so the current hosted harness can resolve them at turn time.
openhuman = { path = "../../vendor/openhuman/crates/openhuman-core", default-features = false }
# Public research sources are mirrored into the isolated run workspace before turns start.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tinyhivemind = { path = "../../crates/tinyhivemind" }
tinyhivemind-embed = { path = "../../crates/tinyhivemind-embed" }
tinyhivemind-hive = { path = "../../crates/tinyhivemind-hive" }
tinyhivemind-openhuman = { path = "../../crates/tinyhivemind-openhuman" }
tinyhivemind-typesafe = { path = "../../crates/tinyhivemind-typesafe" }
tokio = { version = "1", features = ["rt-multi-thread"] }
tempfile = "3"
# The inspector must terminate a hung Docker CLI from the host side.
wait-timeout = "0.2"
wiremock = "0.6"

# `tinyhivemind-openhuman` above is a member of the root workspace and inherits
# `openhuman-embed.workspace = true` from there, which now names the git source
# (see the root `Cargo.toml` comment). `field.workspace = true` only copies the
# dependency *spec* across the workspace boundary; it does not carry the root
# workspace's own `[patch]` table with it. Without a patch here too, this
# standalone workspace would fetch `openhuman-embed` fresh from git instead of
# reusing the vendored submodule the `openhuman`/`openhuman-embed` path
# dependencies above already point at — two copies of OpenHuman's
# process-wide state in one binary. Keep this in sync with the root `[patch]`.
[patch."https://github.com/tinyhumansai/openhuman"]
openhuman-embed = { path = "../../vendor/openhuman/crates/openhuman-embed" }
